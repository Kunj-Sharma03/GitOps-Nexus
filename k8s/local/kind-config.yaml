# ==============================================================================
# GitOps Nexus - Local Kind Cluster Configuration
# ==============================================================================
# Use this configuration to spin up a local single-node Kubernetes cluster:
#   kind create cluster --name gitops-nexus --config k8s/local/kind-config.yaml
# ==============================================================================

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
    extraPortMappings:
      # Map container port 80 to host port 8080 for testing ingress
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      # Map container port 443 to host port 8443 for testing TLS
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
